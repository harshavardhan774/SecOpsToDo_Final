<!DOCTYPE html>
<html>

<head>

    <title>Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-align: center;
            padding-top: 150px;
        }

        .card {
            background: white;
            color: black;
            display: inline-block;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #667eea;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>

</head>

<body>

    <div class="card">

        <h1>Welcome User</h1>

        <p>You have successfully logged in</p>

        <button onclick="location.href='login.html'">Logout</button>

    </div>

</body>

</html>
